<svg xmlns="http://www.w3.org/2000/svg" viewBox="135 20 410 430" width="410" height="430" role="img"><title>White robot knight idle</title><style>
.plume{transform-origin:340px 92px;animation:plume 2.6s ease-in-out infinite}
.scan{animation:scan var(--scan,1.8s) ease-in-out infinite alternate}
.sword{transform-origin:256px 300px}
.arm{transform-origin:270px 226px;animation:idlearm 3s ease-in-out infinite}
.glint{animation:glint 2.4s ease-in-out infinite}
.b{animation:blink 1.2s steps(1) infinite}.d1{animation-delay:.4s}.d2{animation-delay:.8s}
.core{transform-origin:340px 258px;animation:pulse 2s ease-in-out infinite}
@keyframes plume{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(50px)}}
@keyframes idlearm{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes glint{0%,60%{transform:translateY(130px);opacity:0}65%{opacity:1}90%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.18}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="340" cy="436" rx="116" ry="9" fill="#000" opacity=".18"/>
