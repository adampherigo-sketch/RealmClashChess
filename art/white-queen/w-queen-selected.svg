@keyframes halo{0%,100%{transform:scale(.85);opacity:.3}50%{transform:scale(1.2);opacity:.6}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.18}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
