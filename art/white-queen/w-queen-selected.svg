.sh1{animation:bob 2.2s ease-in-out infinite alternate}.sh2{animation:bob 2.6s ease-in-out infinite alternate-reverse}.sh3{animation:bob 1.9s ease-in-out infinite alternate}
.b{animation:blink 1.2s steps(1) infinite}.d1{animation-delay:.4s}.d2{animation-delay:.8s}
.core{transform-origin:340px 236px;animation:pulse 2s ease-in-out infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(46px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wl{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
