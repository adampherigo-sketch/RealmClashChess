.scan{animation:scan var(--scan,1.8s) ease-in-out infinite alternate}
.h1{transform-origin:340px 146px;animation:spin var(--halo,8s) linear infinite}
.h2{transform-origin:340px 146px;animation:spin var(--halo,8s) linear infinite reverse}
.wl{transform-origin:300px 230px;animation:wl 3s ease-in-out infinite}
.wr{transform-origin:380px 230px;animation:wr 3s ease-in-out infinite}
.orb{transform-origin:340px 300px;animation:pulse 1.6s ease-in-out infinite}
