<svg xmlns="http://www.w3.org/2000/svg" viewBox="135 20 410 430" width="410" height="430" role="img"><title>White crystal tower rook attacking</title><style>
.spiral{animation:spiral 3s linear infinite}
.float{animation:float 2.4s ease-in-out infinite alternate}
.spin{transform-origin:340px 72px;animation:spin var(--spin,3s) ease-in-out infinite}
.halo{transform-origin:340px 72px;animation:halo 2.4s ease-in-out infinite}
.sp{animation:blink 1.4s steps(1) infinite}
.b{animation:blink 1.2s steps(1) infinite}.d1{animation-delay:.4s}.d2{animation-delay:.8s}
.win{animation:win 2.2s ease-in-out infinite}
@keyframes spiral{from{transform:translateY(0)}to{transform:translateY(-60px)}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.45)}}
@keyframes halo{0%,100%{transform:scale(.85);opacity:.25}50%{transform:scale(1.1);opacity:.5}}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.18}}
@keyframes win{0%,100%{opacity:1}50%{opacity:.45}}
.spin{animation-duration:.35s}.halo2{transform-origin:340px 72px;animation:charge 1.4s ease-in infinite}@keyframes charge{0%{transform:scale(.6);opacity:.2}55%{transform:scale(1.25);opacity:.75}62%{transform:scale(1.5);opacity:.95}100%{transform:scale(.6);opacity:.2}}.burst{opacity:0;animation:burst 1.4s infinite}@keyframes burst{0%,56%{opacity:0}60%{opacity:1}80%,100%{opacity:0}}.ray{stroke-dasharray:40 200;animation:ray 1.4s infinite}@keyframes ray{0%,56%{stroke-dashoffset:-30}85%,100%{stroke-dashoffset:-140}}.shock{opacity:0;transform-origin:340px 72px;animation:shock 1.4s ease-out infinite}@keyframes shock{0%,58%{opacity:0;transform:scale(.4)}62%{opacity:1}100%{opacity:0;transform:scale(1.8)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="340" cy="436" rx="116" ry="9" fill="#000" opacity=".18"/>
